<title>Interactive Periodic Table</title>
<style>
  :root{
    --bg:#080b12; --bg2:#0d1220; --panel:#121a2b; --line:#25304a;
    --txt:#e9eef8; --dim:#98a4bd; --accent:#5eead4;
    --am:#ff7a6b; --ae:#ffab5e; --tm:#ffd166; --ptm:#8fd694;
    --ml:#5ecfc0; --nm:#5eb2ff; --hg:#b388ff; --ng:#ff7fc4;
    --la:#c2a3ff; --ac:#f79ad3; --un:#8895b0;

  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1100px 620px at 50% -12%,#152033,var(--bg));
       color:var(--txt);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px;
       -webkit-font-smoothing:antialiased}
  h1{font-size:30px;margin:0 0 5px;letter-spacing:-.4px}
  .sub{color:var(--dim);font-size:13.5px;margin-bottom:18px}
  .back{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--dim);
       text-decoration:none;padding:6px 13px;border:1px solid var(--line);border-radius:9px;
       background:var(--panel);margin-bottom:20px}
  .back:hover{color:var(--txt);border-color:var(--accent)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--txt);
       padding:9px 13px;border-radius:9px;width:260px;outline:none;font-size:14px}
  input[type=search]:focus{border-color:var(--accent)}
  .legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:11.5px;padding:5px 10px;border-radius:20px;cursor:pointer;
        border:1px solid transparent;background:var(--panel);color:var(--dim);user-select:none}
  .chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .chip.on{color:#0b0f17;font-weight:600}
  .table{display:grid;grid-template-columns:repeat(18,minmax(38px,1fr));gap:4px;max-width:1180px}
  .cell{position:relative;aspect-ratio:1/1.14;border-radius:6px;cursor:pointer;padding:3px 4px;
        border:1px solid rgba(255,255,255,.10);transition:transform .12s,filter .12s,opacity .2s;
        display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .cell:hover{transform:translateY(-4px) scale(1.08);z-index:5;filter:brightness(1.3);
        box-shadow:0 10px 28px rgba(0,0,0,.6);border-color:rgba(255,255,255,.35)}
  .cell .z{position:absolute;top:2px;left:4px;font-size:9px;opacity:.75}
  .cell .sym{font-size:16px;font-weight:700;text-align:center;line-height:1}
  .cell .nm{font-size:7.5px;text-align:center;opacity:.85;margin-top:2px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .ms{font-size:7.5px;text-align:center;opacity:.62;margin-top:1px;
        font-variant-numeric:tabular-nums}
  .cell.dim{opacity:.14;filter:grayscale(1)}
  .spacer{grid-column:span 18;height:10px}
  .note{grid-column:3/18;font-size:11px;color:var(--dim);text-align:center;padding:2px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(4,7,14,.72);backdrop-filter:blur(4px);
        display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);
        max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.7)}
  .mhead{display:flex;gap:18px;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
  .badge{width:92px;height:92px;border-radius:14px;display:flex;flex-direction:column;
        align-items:center;justify-content:center;flex:none;border:1px solid rgba(255,255,255,.15)}
  .badge b{font-size:34px;line-height:1}
  .badge span{font-size:11px;opacity:.8}
  .mhead h2{margin:0;font-size:24px}
  .tag{display:inline-block;margin-top:6px;font-size:12px;padding:3px 10px;border-radius:20px;
        font-weight:600;color:#0b0f17}
  .body{padding:20px 24px 26px}
  .why{background:var(--panel);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;
        padding:13px 16px;margin-bottom:18px;font-size:14px}
  .why h4{margin:0 0 6px;font-size:12px;letter-spacing:1px;color:var(--accent);text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .stat .k{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
  .stat .v{font-size:15px;font-weight:600;margin-top:2px}
  .sec{margin-top:20px}
  .sec h3{font-size:12px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;margin:0 0 9px}
  .shells{display:flex;gap:8px;flex-wrap:wrap}
  .shell{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:7px 12px;text-align:center;min-width:56px}
  .shell .n{font-size:10px;color:var(--dim)}
  .shell .e{font-size:17px;font-weight:700}
  .fact{background:var(--panel);border-radius:10px;padding:13px 16px;font-size:14px;color:#d6deee}
  .close{position:sticky;top:0;float:right;margin:12px 14px 0 0;background:none;border:none;
        color:var(--dim);font-size:26px;cursor:pointer;line-height:1}
  .close:hover{color:var(--txt)}
  @media(max-width:820px){body{padding:12px}.table{grid-template-columns:repeat(18,minmax(26px,1fr));gap:2px}
    .cell .nm{display:none}.cell .sym{font-size:11px}.cell .z{font-size:7px}
    .cell .ms{font-size:6px}
    .wrap{overflow-x:auto}}
</style>
</head>

<h1>The Interactive Periodic Table</h1>
<div class="sub">Click any element for its numbers, its family, and <em>why</em> it belongs there.</div>

const CAT = {
  am:{n:"Alkali Metal",c:"var(--am)",why:"It sits in Group 1 with exactly <b>one electron in its outer shell</b>. That lone electron is held so loosely that the atom gives it away almost instantly, forming a +1 ion. That is why alkali metals are soft, shiny, and react violently with water."},
  ae:{n:"Alkaline Earth Metal",c:"var(--ae)",why:"Group 2, so it has <b>two outer electrons</b>. Losing two is harder than losing one, so it is denser, harder and less explosive than an alkali metal, but it still reacts readily and forms +2 ions."},
  tm:{n:"Transition Metal",c:"var(--tm)",why:"Its <b>d-orbitals are partly filled</b>. Electrons can be borrowed from both the d and s shells, so it shows several oxidation states, forms coloured compounds, conducts well and makes an excellent catalyst."},
  ptm:{n:"Post-Transition Metal",c:"var(--ptm)",why:"It comes just after the d-block with a <b>full d-shell and p-electrons outside it</b>. Full d-shells mean weak metallic bonding, so these metals are soft, low-melting, and behave more 'lazily' than transition metals."},
  ml:{n:"Metalloid",c:"var(--ml)",why:"It sits on the <b>staircase line</b> between metals and nonmetals, so it neither holds nor releases electrons decisively. The result is in-between behaviour: it looks metallic but is brittle, and conducts electricity only <i>somewhat</i>, the basis of all semiconductors."},
  nm:{n:"Reactive Nonmetal",c:"var(--nm)",why:"Its outer shell is <b>nearly full</b>, so it pulls electrons in rather than giving them away. That means no metallic sea of electrons: it is a poor conductor, brittle if solid, and bonds by sharing (covalent) or grabbing (ionic) electrons."},
  hg:{n:"Halogen",c:"var(--hg)",why:"Group 17, <b>seven outer electrons, one short of a full shell</b>. It is desperate for that last electron, which makes halogens the most aggressively reactive nonmetals, forming −1 ions and diatomic molecules like Cl₂."},
  ng:{n:"Noble Gas",c:"var(--ng)",why:"Its outer shell is <b>completely full</b> (2 electrons for He, 8 for the rest). With nothing to gain or lose, it has almost no reason to react, hence 'noble': unreactive, monatomic, colourless gases."},
  la:{n:"Lanthanide",c:"var(--la)",why:"Its extra electrons go into <b>buried 4f orbitals</b>, shielded from the outside world. Since the outer shell barely changes, all lanthanides behave almost identically chemically, which is why they are so notoriously hard to separate."},
  ac:{n:"Actinide",c:"var(--ac)",why:"Electrons fill the <b>5f orbitals</b>, and the nucleus is so large that it can no longer hold itself together, every actinide is <b>radioactive</b>. The 5f electrons are less shielded than 4f, so actinides show a wider range of oxidation states."},
  un:{n:"Unknown / Predicted",c:"var(--un)",why:"This is a <b>synthetic superheavy element</b>, made a few atoms at a time in a particle accelerator and lasting only fractions of a second. Its chemistry is predicted from its position, not measured."}

const SYNTH=new Set("Tc Pm Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og".split(" "));

/* ---------- parse + position ---------- */
const ELS=RAW.trim().split("\n").map(l=>{
  const[z,sym,name,mass,cat]=l.trim().split(/\s+/);
  const e={z:+z,sym,name,mass:+mass,cat};
  // grid position
  const Z=e.z;                        // must be numeric: "5"+6 would concatenate
  let x,y;
  if(Z==1){x=1;y=1}else if(Z==2){x=18;y=1}
  else if(Z<=10){y=2;x=Z<=4?Z-2:Z+8}
  else if(Z<=18){y=3;x=Z<=12?Z-10:Z}
  else if(Z<=36){y=4;x=Z-18}
  else if(Z<=54){y=5;x=Z-36}
  else if(Z<=56){y=6;x=Z-54}
  else if(Z<=71){y=9;x=Z-54}          // lanthanide strip
  else if(Z<=86){y=6;x=Z-68}
  else if(Z<=88){y=7;x=Z-86}
  else if(Z<=103){y=10;x=Z-86}        // actinide strip
  else{y=7;x=Z-100}
  e.x=x;e.y=y;
  e.period=(y<=8)?y:(y==9?6:7);
  e.group=(y>8)?null:x;
  e.block=(y>8)?"f":(x<=2&&sym!="He")?"s":(x>=3&&x<=12)?"d":"p";
  if(sym=="He")e.block="s";
  e.state=GAS.has(sym)?"Gas":LIQ.has(sym)?"Liquid":SYNTH.has(sym)?"Solid (presumed)":"Solid";
  return e;
});

/* ---------- electron shells (Aufbau + known exceptions) ---------- */
const ORDER=[["1s",2],["2s",2],["2p",6],["3s",2],["3p",6],["4s",2],["3d",10],["4p",6],
             ["5s",2],["4d",10],["5p",6],["6s",2],["4f",14],["5d",10],["6p",6],
             ["7s",2],["5f",14],["6d",10],["7p",6]];
const EXC={24:"1s2 2s2 2p6 3s2 3p6 3d5 4s1",29:"1s2 2s2 2p6 3s2 3p6 3d10 4s1",
41:"[Kr] 4d4 5s1",42:"[Kr] 4d5 5s1",44:"[Kr] 4d7 5s1",45:"[Kr] 4d8 5s1",
46:"[Kr] 4d10",47:"[Kr] 4d10 5s1",57:"[Xe] 5d1 6s2",58:"[Xe] 4f1 5d1 6s2",
64:"[Xe] 4f7 5d1 6s2",78:"[Xe] 4f14 5d9 6s1",79:"[Xe] 4f14 5d10 6s1",
89:"[Rn] 6d1 7s2",90:"[Rn] 6d2 7s2",91:"[Rn] 5f2 6d1 7s2",92:"[Rn] 5f3 6d1 7s2",
93:"[Rn] 5f4 6d1 7s2",96:"[Rn] 5f7 6d1 7s2"};

const CORE={"[He]":"1s2","[Ne]":"1s2 2s2 2p6","[Ar]":"1s2 2s2 2p6 3s2 3p6",
  "[Kr]":"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6",
  "[Xe]":"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2 5p6",
  "[Rn]":"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 5s2 5p6 4f14 5d10 6s2 6p6"};
const SUB="spdf";
function config(z){
  let toks;
  if(EXC[z]){
    toks=EXC[z].replace(/\[\w+\]/,m=>CORE[m]).split(" ");
  }else{
    let left=z;toks=[];
    for(const[orb,cap]of ORDER){
      if(left<=0)break;
      const n=Math.min(cap,left);left-=n;toks.push(orb+n);
    }
  }
  // display in shell order (3d before 4s), the way textbooks write it
  return toks.sort((a,b)=> a[0]-b[0] || SUB.indexOf(a[1])-SUB.indexOf(b[1])).join(" ");
}
function shells(z){
  const s=[];
  for(const t of config(z).split(" ")){
    const lvl=+t[0];s[lvl-1]=(s[lvl-1]||0)+ +t.slice(2);
  }
  return s.map(v=>v||0);
}
function valence(e){
  if(e.block=="s")return e.group;
  if(e.block=="p")return e.group-10;
  return null;
}

/* ---------- render grid ---------- */
const table=document.getElementById("table");
function build(){
  table.innerHTML="";
  ELS.filter(e=>e.y<=7).forEach(place);
  const sp=document.createElement("div");sp.className="spacer";sp.style.gridRow=8;table.appendChild(sp);
  const n1=document.createElement("div");n1.className="note";n1.style.gridRow=9;
  n1.textContent="Lanthanides (57 to 71) and Actinides (89 to 103), pulled out below to keep the table readable";
  table.appendChild(n1);
  ELS.filter(e=>e.y>8).forEach(place);
  // placeholders in the main table for the f-block
  ph(3,6,"57 to 71");ph(3,7,"89 to 103");
}
function place(e){
  const d=document.createElement("div");
  d.className="cell";d.dataset.z=e.z;
  d.style.gridColumn=e.x;
  d.style.gridRow=e.y<=7?e.y:e.y+1;   // f-block strips drop below the spacer + caption rows
  const c=CAT[e.cat].c;
  d.style.background=`color-mix(in srgb, ${c} 22%, transparent)`;
  d.style.borderColor=`color-mix(in srgb, ${c} 55%, transparent)`;
  d.innerHTML=`<div class="z">${e.z}</div><div class="sym" style="color:${c}">${e.sym}</div>`+
              `<div class="nm">${e.name}</div><div class="ms">${Math.round(e.mass)}</div>`;
  d.onclick=()=>open(e);
  table.appendChild(d);
}
function ph(x,y,txt){
  const d=document.createElement("div");
  d.className="cell";d.style.gridColumn=x;d.style.gridRow=y;
  d.style.background="rgba(255,255,255,.04)";d.style.cursor="default";
  d.innerHTML=`<div class="sym" style="font-size:9px;color:var(--dim)">${txt}</div>`;
  table.appendChild(d);
}
build();

/* ---------- legend / filter ---------- */
const legend=document.getElementById("legend");
let active=null;
Object.entries(CAT).forEach(([k,v])=>{
  const b=document.createElement("div");
  b.className="chip";b.innerHTML=`<span class="dot" style="background:${v.c}"></span>${v.n}`;
  b.onclick=()=>{
    active=active===k?null:k;
    [...legend.children].forEach(c=>{c.className="chip";c.style.background="var(--panel)"});
    if(active){b.className="chip on";b.style.background=v.c}
    filter();
  };
  legend.appendChild(b);
});

/* ---------- search ---------- */
const q=document.getElementById("q"),count=document.getElementById("count");
q.oninput=filter;
function filter(){
  const t=q.value.trim().toLowerCase();
  let shown=0;
  document.querySelectorAll(".cell[data-z]").forEach(c=>{
    const e=ELS[+c.dataset.z-1];
    const okT=!t||e.name.toLowerCase().includes(t)||e.sym.toLowerCase()===t||
              e.sym.toLowerCase().startsWith(t)||String(e.z)===t;
    const okC=!active||e.cat===active;
    const ok=okT&&okC;
    c.classList.toggle("dim",!ok);
    if(ok)shown++;
  });
  count.textContent=(t||active)?`${shown} element${shown==1?"":"s"} shown`:"";
}

/* ---------- detail modal ---------- */
const overlay=document.getElementById("overlay"),modal=document.getElementById("modal");
function open(e){
  const cat=CAT[e.cat],c=cat.c;
  const A=Math.round(e.mass), sh=shells(e.z), v=valence(e);
  const why=NUANCE[e.sym]?NUANCE[e.sym]+"<br><br>"+cat.why:cat.why;
  modal.innerHTML=`
   <button class="close" onclick="closeM()">&times;</button>
   <div class="mhead">
     <div class="badge" style="background:color-mix(in srgb,${c} 25%,transparent);color:${c}">
       <span>${e.z}</span><b>${e.sym}</b><span>${e.mass}</span>
     </div>
     <div>
       <h2>${e.name}</h2>
       <div class="tag" style="background:${c}">${cat.n}</div>
     </div>
   </div>
   <div class="body">
     <div class="why"><h4>Why is it a ${cat.n.toLowerCase()}?</h4>${why}</div>

     <div class="grid">
       ${st("Atomic number (Z)",e.z)}
       ${st("Atomic mass",e.mass+" u")}
       ${st("Mass number (A)","≈ "+A)}
       ${st("Protons",e.z)}
       ${st("Electrons",e.z)}
       ${st("Neutrons","≈ "+(A-e.z))}
       ${st("Group",e.group?e.group:"f-block (no group)")}
       ${st("Period",e.period)}
       ${st("Block",e.block+"-block")}
       ${st("State at 25 °C",e.state)}
       ${v!=null?st("Valence electrons",v):""}
     </div>

     <div class="sec">
       <h3>Electron configuration</h3>
       <div class="fact" style="font-family:ui-monospace,Consolas,monospace;font-size:13px">${config(e.z)}</div>
     </div>

     <div class="sec">
       <h3>Electrons per shell</h3>
       <div class="shells">${sh.map((n,i)=>
         `<div class="shell"><div class="n">shell ${i+1}</div><div class="e" style="color:${c}">${n}</div></div>`).join("")}</div>
     </div>

     <div class="sec">
       <h3>Worth knowing</h3>
       <div class="fact">${FACT[e.sym]||""}</div>
     </div>
   </div>`;
  overlay.classList.add("open");
  overlay.dataset.z=e.z;
}
function st(k,v){return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`}
function closeM(){overlay.classList.remove("open")}
overlay.onclick=ev=>{if(ev.target===overlay)closeM()};
document.onkeydown=ev=>{
  if(ev.key==="Escape")closeM();
  if(!overlay.classList.contains("open"))return;
  const z=+overlay.dataset.z;
  if(ev.key==="ArrowRight"&&z<118)open(ELS[z]);
  if(ev.key==="ArrowLeft"&&z>1)open(ELS[z-2]);
};
</script>
</body>
</html>
