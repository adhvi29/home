<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diary Lockscreen</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:'Segoe UI', sans-serif; }
  #ls-root {
    width:680px; height:520px; position:relative;
    overflow:hidden; cursor:pointer;
    border-radius:12px;
  }
  canvas#scene-canvas { position:absolute; inset:0; width:100%; height:100%; }
  #ls-overlay {
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:520px; padding:2rem;
    transition:transform 0.65s cubic-bezier(0.4,0,0.2,1), opacity 0.65s ease;
  }
  #ls-overlay.slide-up { transform:translateY(-70px); opacity:0; pointer-events:none; }
  #ls-time {
    font-size:88px; font-weight:200; color:#fff;
    letter-spacing:-3px; line-height:1;
    text-shadow:0 0 40px rgba(255,255,255,0.4), 0 2px 8px rgba(0,0,0,0.4);
  }
  #ls-date { font-size:17px; font-weight:300; color:rgba(255,255,255,0.85); margin-top:10px; letter-spacing:0.5px; text-shadow:0 1px 6px rgba(0,0,0,0.4); }
  #ls-hint { margin-top:52px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  #ls-hint span { font-size:12px; color:rgba(255,255,255,0.6); letter-spacing:1.5px; text-transform:uppercase; }
  .hint-arrow { width:30px; height:30px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.4); display:flex; align-items:center; justify-content:center; animation:bob 2s ease-in-out infinite; }
  .hint-arrow i { font-size:14px; color:rgba(255,255,255,0.75); }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  #ls-badge { position:absolute; bottom:18px; right:18px; z-index:3; display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.28); border:0.5px solid rgba(255,255,255,0.15); border-radius:20px; padding:5px 12px; }
  #ls-badge i { font-size:13px; color:rgba(255,255,255,0.6); }
  #ls-badge span { font-size:12px; color:rgba(255,255,255,0.6); }
  #ls-dots { position:absolute; bottom:22px; left:20px; z-index:3; display:flex; gap:6px; }
  .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.3); transition:background 0.4s; }
  .dot.on { background:rgba(255,255,255,0.9); }
  #unlock-panel { position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.45); opacity:0; pointer-events:none; transition:opacity 0.5s ease; border-radius:12px; }
  #unlock-panel.show { opacity:1; pointer-events:all; }
  .u-avatar { width:74px; height:74px; border-radius:50%; background:linear-gradient(135deg,#c47eb5,#8b6fc9); display:flex; align-items:center; justify-content:center; font-size:30px; color:#fff; margin-bottom:14px; border:2px solid rgba(255,255,255,0.3); }
  .u-name { font-size:18px; color:#fff; font-weight:300; margin-bottom:22px; }
  .u-wrap { position:relative; width:230px; }
  .u-wrap input { width:100%; padding:10px 42px 10px 16px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.28); border-radius:4px; color:#fff; font-size:15px; letter-spacing:2px; outline:none; }
  .u-wrap input::placeholder { color:rgba(255,255,255,0.4); letter-spacing:0; }
  .u-wrap input:focus { border-color:rgba(255,255,255,0.6); }
  .u-btn { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.18); border:none; border-radius:3px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; }
  .u-btn:hover { background:rgba(255,255,255,0.32); }
  .u-back { margin-top:16px; font-size:12px; color:rgba(255,255,255,0.4); cursor:pointer; }
  .u-back:hover { color:rgba(255,255,255,0.7); }
  #done { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff; opacity:0; pointer-events:none; transition:opacity 0.45s ease; border-radius:12px; gap:12px; }
  #done.show { opacity:1; }
  #done i { font-size:50px; color:#c47eb5; }
  #done span { font-size:18px; color:#111; }
  #done small { font-size:13px; color:#666; }
</style>
</head>
<body>

<div id="ls-root">
  <canvas id="scene-canvas"></canvas>
  <div id="ls-overlay">
    <div id="ls-time">--:--</div>
    <div id="ls-date"></div>
    <div id="ls-hint">
      <div class="hint-arrow"><i class="ti ti-chevron-up"></i></div>
      <span>Click to unlock</span>
    </div>
  </div>
  <div id="ls-badge"><i class="ti ti-sparkles"></i><span id="bg-label">Scene</span></div>
  <div id="ls-dots"></div>
  <div id="unlock-panel">
    <div class="u-avatar"><i class="ti ti-user"></i></div>
    <div class="u-name">My Diary</div>
    <div class="u-wrap">
      <input type="password" placeholder="Password" id="pw" />
      <button class="u-btn" id="go"><i class="ti ti-arrow-right"></i></button>
    </div>
    <div class="u-back" id="back">← Back</div>
  </div>
  <div id="done">
    <i class="ti ti-notebook"></i>
    <span>Welcome back</span>
    <small>Opening your diary…</small>
  </div>
</div>

<script>
const canvas = document.getElementById('scene-canvas');
const ctx = canvas.getContext('2d');
const W = 680, H = 520;
canvas.width = W; canvas.height = H;

const scenes = [
  { label:'🌸 Sakura Evening', draw: drawSakura },
  { label:'🌙 Moonlit Ocean',  draw: drawOcean },
  { label:'🌅 Anime Sunrise',  draw: drawSunrise },
  { label:'✨ Starfall Night', draw: drawStarfall },
  { label:'🏔️ Mountain Spirit', draw: drawMountain },
];

let curScene = Math.floor(Math.random() * scenes.length);
let t = 0, transitioning = false, alpha = 1, lastSwitch = 0;

/* ── SAKURA ── */
const petals = Array.from({length:38}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  size: Math.random()*6+4, speed: Math.random()*0.6+0.3,
  drift: Math.random()*0.8-0.4, rot: Math.random()*Math.PI*2,
  rotSpeed: (Math.random()-0.5)*0.04, sway: Math.random()*2+1, swayOff: Math.random()*100
}));
function drawSakura(t) {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a0525'); g.addColorStop(0.4,'#6b1a5e'); g.addColorStop(0.75,'#d4527a'); g.addColorStop(1,'#f0a0b0');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // moon
  const mx=W*0.72, my=H*0.22;
  const mg=ctx.createRadialGradient(mx,my,0,mx,my,60);
  mg.addColorStop(0,'rgba(255,240,200,0.95)'); mg.addColorStop(0.5,'rgba(255,220,180,0.5)'); mg.addColorStop(1,'rgba(255,200,160,0)');
  ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,60,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,245,215,0.92)'; ctx.beginPath(); ctx.arc(mx,my,28,0,Math.PI*2); ctx.fill();
  // tree branches
  function branch(x,y,angle,len,depth) {
    if(depth===0||len<3) return;
    const ex=x+Math.cos(angle)*len, ey=y+Math.sin(angle)*len;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey);
    ctx.lineWidth=Math.max(1,depth*1.4); ctx.strokeStyle='rgba(10,0,15,0.85)'; ctx.stroke();
    branch(ex,ey,angle-0.4+Math.sin(t*0.001+depth)*0.05,len*0.68,depth-1);
    branch(ex,ey,angle+0.35+Math.cos(t*0.001+depth)*0.05,len*0.65,depth-1);
  }
  branch(120,H,-Math.PI/2,90,7); branch(W-100,H,-Math.PI/2,80,6);
  // petals
  petals.forEach(p => {
    p.y += p.speed; p.x += p.drift + Math.sin(t*0.02+p.swayOff)*p.sway*0.05; p.rot += p.rotSpeed;
    if(p.y>H+10) { p.y=-10; p.x=Math.random()*W; }
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.beginPath();
    for(let i=0;i<5;i++) {
      const a=((i*2*Math.PI)/5)-Math.PI/2;
      ctx.lineTo(Math.cos(a)*p.size, Math.sin(a)*p.size);
      ctx.lineTo(Math.cos(a+Math.PI/5)*p.size*0.4, Math.sin(a+Math.PI/5)*p.size*0.4);
    }
    ctx.closePath();
    ctx.fillStyle=`rgba(255,182,200,${0.5+Math.sin(t*0.01+p.swayOff)*0.2})`; ctx.fill();
    ctx.restore();
  });
  const og=ctx.createLinearGradient(0,H*0.6,0,H);
  og.addColorStop(0,'rgba(100,0,60,0)'); og.addColorStop(1,'rgba(20,0,30,0.6)');
  ctx.fillStyle=og; ctx.fillRect(0,0,W,H);
}

/* ── OCEAN ── */
const waves = Array.from({length:5},(_,i)=>({offset:i*60, speed:0.3+i*0.1}));
function drawOcean(t) {
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#020818'); g.addColorStop(0.5,'#05163a'); g.addColorStop(1,'#0a2a5e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<80;i++) {
    const sx=((i*137.5)%W), sy=((i*97.3)%(H*0.55));
    const br=0.4+Math.sin(t*0.03+i)*0.4;
    ctx.beginPath(); ctx.arc(sx,sy,Math.random()*1+0.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${br})`; ctx.fill();
  }
  const mx=W*0.3, my=H*0.18;
  const mg=ctx.createRadialGradient(mx,my,0,mx,my,80);
  mg.addColorStop(0,'rgba(200,230,255,0.9)'); mg.addColorStop(0.4,'rgba(150,200,255,0.35)'); mg.addColorStop(1,'rgba(100,160,255,0)');
  ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,80,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(220,240,255,0.95)'; ctx.beginPath(); ctx.arc(mx,my,26,0,Math.PI*2); ctx.fill();
  for(let r=0;r<8;r++) {
    const rw=6-r*0.5, ry=H*0.55+r*14+Math.sin(t*0.04+r)*4;
    ctx.fillStyle=`rgba(200,230,255,${0.18-r*0.02})`;
    ctx.fillRect(mx-rw/2, ry, rw+Math.sin(t*0.05)*3, 6);
  }
  const wh=H*0.52;
  waves.forEach((w,i)=>{
    ctx.beginPath(); ctx.moveTo(0,wh+w.offset);
    for(let x=0;x<=W;x+=4) {
      const y=wh+w.offset+Math.sin((x*0.015)+t*0.04*w.speed+i)*12+Math.sin((x*0.03)+t*0.025*w.speed)*6;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
    ctx.fillStyle=`rgba(5,${30+i*12},${80+i*15},${0.55-i*0.07})`; ctx.fill();
  });
}

/* ── SUNRISE ── */
let cloudOff = Array.from({length:4},()=>Math.random()*200);
function drawSunrise(t) {
  const sunY=H*0.38+Math.sin(t*0.005)*8;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0520'); g.addColorStop(0.3,'#3d0d5e'); g.addColorStop(0.55,'#c0363a'); g.addColorStop(0.75,'#f07020'); g.addColorStop(1,'#f8c040');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(W/2,sunY);
  for(let r=0;r<12;r++) {
    const a=(r/12)*Math.PI*2+t*0.005;
    const len=120+Math.sin(t*0.02+r)*20;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*len, Math.sin(a)*len);
    ctx.strokeStyle=`rgba(255,200,80,${0.08+Math.sin(t*0.03+r)*0.04})`; ctx.lineWidth=18; ctx.stroke();
  }
  const sg=ctx.createRadialGradient(0,0,0,0,0,100);
  sg.addColorStop(0,'rgba(255,240,150,0.95)'); sg.addColorStop(0.3,'rgba(255,180,60,0.5)'); sg.addColorStop(1,'rgba(255,120,20,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(0,0,100,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,245,180,0.97)'; ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.fill();
  ctx.restore();
  cloudOff.forEach((o,i)=>{
    cloudOff[i]=(o+0.18*(i+1)*0.5)%(W+200);
    const cx=cloudOff[i]-100, cy=H*0.3+i*30;
    ctx.save(); ctx.globalAlpha=0.55+i*0.05;
    ctx.fillStyle=`rgba(255,${160+i*15},${100+i*10},0.6)`;
    [0,30,60,90].forEach(dx=>{ ctx.beginPath(); ctx.ellipse(cx+dx,cy,30+dx*0.1,16,0,0,Math.PI*2); ctx.fill(); });
    ctx.restore();
  });
  ctx.fillStyle='rgba(10,3,20,0.8)';
  ctx.beginPath(); ctx.moveTo(0,H);
  ctx.bezierCurveTo(W*0.2,H*0.7,W*0.4,H*0.65,W*0.5,H*0.72);
  ctx.bezierCurveTo(W*0.6,H*0.79,W*0.8,H*0.68,W,H*0.72);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}

/* ── STARFALL ── */
const stars2=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.3,twinkle:Math.random()*100}));
const meteors=Array.from({length:4},(_,i)=>({x:-200+i*180,y:-50+i*30,vx:3+i,vy:2+i*0.5,life:0,maxLife:60+i*20,active:false}));
function drawStarfall(t) {
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#010208'); g.addColorStop(0.5,'#050d2a'); g.addColorStop(1,'#0a1540');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const ng=ctx.createRadialGradient(W*0.6,H*0.3,0,W*0.6,H*0.3,200);
  ng.addColorStop(0,'rgba(80,40,140,0.18)'); ng.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);
  const ng2=ctx.createRadialGradient(W*0.2,H*0.6,0,W*0.2,H*0.6,150);
  ng2.addColorStop(0,'rgba(20,80,120,0.15)'); ng2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ng2; ctx.fillRect(0,0,W,H);
  stars2.forEach(s=>{
    const br=0.4+Math.sin(t*0.05+s.twinkle)*0.5;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${br})`; ctx.fill();
  });
  meteors.forEach(m=>{
    if(!m.active&&Math.random()<0.005){m.active=true;m.x=Math.random()*W;m.y=0;m.life=0;}
    if(m.active){
      m.x+=m.vx*2; m.y+=m.vy*2; m.life++;
      const gm=ctx.createLinearGradient(m.x-m.vx*8,m.y-m.vy*8,m.x,m.y);
      gm.addColorStop(0,'rgba(255,255,255,0)'); gm.addColorStop(1,`rgba(180,220,255,${0.7*(1-m.life/m.maxLife)})`);
      ctx.beginPath(); ctx.moveTo(m.x-m.vx*8,m.y-m.vy*8); ctx.lineTo(m.x,m.y);
      ctx.strokeStyle=gm; ctx.lineWidth=2; ctx.stroke();
      if(m.life>m.maxLife||m.x>W||m.y>H) m.active=false;
    }
  });
  const mx=W*0.2, my=H*0.22;
  for(let r=3;r>0;r--){
    ctx.beginPath(); ctx.arc(mx,my,24+r*14,0,Math.PI*2);
    ctx.strokeStyle=`rgba(150,200,255,${0.06-r*0.01})`; ctx.lineWidth=r*3; ctx.stroke();
  }
  ctx.fillStyle='rgba(200,230,255,0.95)'; ctx.beginPath(); ctx.arc(mx,my,22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(2,5,18,0.95)';
  [[0,180],[55,200],[90,160],[135,210],[160,170],[210,195],[240,155],[295,185],[330,175],[375,205],[415,165],[465,200],[498,175],[552,190],[588,160],[632,180]].forEach(([x,top])=>{
    ctx.fillRect(x,top,40,H-top);
    for(let wy=top+10;wy<H-10;wy+=16) for(let wx=x+6;wx<x+34;wx+=12){
      if(Math.random()<0.35){ctx.fillStyle='rgba(255,240,150,0.6)';ctx.fillRect(wx,wy,5,7);ctx.fillStyle='rgba(2,5,18,0.95)';}
    }
  });
}

/* ── MOUNTAIN ── */
function drawMountain(t) {
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#020a18'); g.addColorStop(0.4,'#0d2040'); g.addColorStop(0.7,'#1a4060'); g.addColorStop(1,'#0a1a30');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<3;i++){
    const ag=ctx.createLinearGradient(0,H*0.1+i*40,0,H*0.45+i*40);
    const colors=[['rgba(0,255,120,','rgba(0,200,255,'],['rgba(100,0,255,','rgba(0,180,255,'],['rgba(0,255,180,','rgba(150,0,255,']];
    ag.addColorStop(0,colors[i][0]+'0)'); ag.addColorStop(0.5,colors[i][0]+'0.07)'); ag.addColorStop(1,colors[i][1]+'0)');
    ctx.fillStyle=ag;
    ctx.beginPath(); ctx.moveTo(0,H*0.15+i*30);
    for(let x=0;x<=W;x+=5){
      const y=H*0.2+i*30+Math.sin(x*0.01+t*0.02+i*2)*30+Math.sin(x*0.02+t*0.015)*15;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,0); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
  }
  for(let i=0;i<60;i++){
    const sx=((i*173)%W), sy=((i*113)%(H*0.5));
    const br=0.3+Math.sin(t*0.04+i*0.7)*0.45;
    ctx.beginPath(); ctx.arc(sx,sy,0.8,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${br})`; ctx.fill();
  }
  ctx.fillStyle='rgba(15,30,55,0.9)';
  ctx.beginPath(); ctx.moveTo(0,H);
  ctx.lineTo(0,H*0.55); ctx.lineTo(W*0.15,H*0.3); ctx.lineTo(W*0.3,H*0.48);
  ctx.lineTo(W*0.45,H*0.22); ctx.lineTo(W*0.6,H*0.42); ctx.lineTo(W*0.75,H*0.28);
  ctx.lineTo(W*0.88,H*0.46); ctx.lineTo(W,H*0.35); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(200,220,255,0.7)';
  [[W*0.45,H*0.22,25],[W*0.75,H*0.28,18],[W*0.15,H*0.3,14]].forEach(([px,py,sz])=>{
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-sz,py+sz*1.2); ctx.lineTo(px+sz,py+sz*1.2); ctx.closePath(); ctx.fill();
  });
  ctx.fillStyle='rgba(5,12,25,0.97)';
  ctx.beginPath(); ctx.moveTo(0,H);
  ctx.lineTo(0,H*0.75); ctx.lineTo(W*0.2,H*0.5); ctx.lineTo(W*0.35,H*0.65);
  ctx.lineTo(W*0.55,H*0.45); ctx.lineTo(W*0.7,H*0.6); ctx.lineTo(W*0.85,H*0.52);
  ctx.lineTo(W,H*0.65); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  const rg=ctx.createLinearGradient(0,H*0.78,0,H);
  rg.addColorStop(0,'rgba(0,150,200,0.15)'); rg.addColorStop(1,'rgba(0,80,120,0.3)');
  ctx.fillStyle=rg; ctx.fillRect(0,H*0.78,W,H*0.22);
  for(let i=0;i<5;i++){
    const wy=H*0.8+i*8+Math.sin(t*0.03+i)*3;
    ctx.beginPath(); ctx.moveTo(0,wy);
    for(let x=0;x<=W;x+=6) ctx.lineTo(x,wy+Math.sin(x*0.03+t*0.04)*2);
    ctx.strokeStyle=`rgba(100,200,255,${0.08-i*0.01})`; ctx.lineWidth=1.5; ctx.stroke();
  }
}

/* ── DOTS & LABELS ── */
const dotsEl=document.getElementById('ls-dots');
scenes.forEach((_,i)=>{
  const d=document.createElement('div');
  d.className='dot'+(i===curScene?' on':'');
  dotsEl.appendChild(d);
});
function setDots(idx){
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===idx));
  document.getElementById('bg-label').textContent=scenes[idx].label;
}
setDots(curScene);

/* ── RENDER LOOP ── */
function loop(ts){
  t=ts;
  if(transitioning){ alpha=Math.max(0,alpha-0.04); if(alpha<=0){curScene=(curScene+1)%scenes.length;alpha=0;transitioning=false;setDots(curScene);lastSwitch=ts;} }
  else if(ts-lastSwitch>8000){ transitioning=true; }
  ctx.clearRect(0,0,W,H);
  ctx.globalAlpha=1;
  if(transitioning&&alpha<1){
    scenes[curScene].draw(t);
    ctx.globalAlpha=1-alpha;
    scenes[(curScene+1)%scenes.length].draw(t);
    ctx.globalAlpha=1;
  } else { scenes[curScene].draw(t); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── CLOCK ── */
function tick(){
  const n=new Date();
  document.getElementById('ls-time').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('ls-date').textContent=days[n.getDay()]+', '+months[n.getMonth()]+' '+n.getDate();
}
tick(); setInterval(tick,10000);

/* ── UNLOCK LOGIC ── */
const root=document.getElementById('ls-root');
const panel=document.getElementById('unlock-panel');
const overlay=document.getElementById('ls-overlay');
const done=document.getElementById('done');

root.addEventListener('click',()=>{
  if(panel.classList.contains('show')) return;
  overlay.classList.add('slide-up');
  setTimeout(()=>panel.classList.add('show'),400);
});
document.getElementById('back').addEventListener('click',e=>{
  e.stopPropagation(); panel.classList.remove('show');
  setTimeout(()=>overlay.classList.remove('slide-up'),200);
});
function unlock(){ panel.classList.remove('show'); setTimeout(()=>done.classList.add('show'),200); }
document.getElementById('go').addEventListener('click',e=>{e.stopPropagation();unlock();});
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter'){e.stopPropagation();unlock();}});
document.getElementById('pw').addEventListener('click',e=>e.stopPropagation());
</script>
